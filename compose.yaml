services:
  medicalapi:
    build:
      context: .
      dockerfile: ./Dockerfile
  
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:12345@db:5432/mydb1

    command: uvicorn SRC.main:app --host 0.0.0.0 --port 8000

  db:
    image: "postgres:15"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mydb1
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
volumes:
  postgres_data: